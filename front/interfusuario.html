<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="assets/interfusuario.css">
</head>
<body>
    <div class="profile-container">
        <!-- Vista Normal -->
        <div id="viewMode">
            <div class="profile-picture" onclick="changePicture()">
                <span id="userInitials">JD</span>
            </div>
            
            <h1 class="user-name" id="displayName">Juan Pérez</h1>
            <p class="user-email" id="displayEmail">juan.perez@email.com</p>
            
            <div class="user-info">
                <div class="info-row">
                    <span class="info-label">📱 Teléfono:</span>
                    <span class="info-value" id="displayPhone">+54 11 1234-5678</span>
                </div>
                <div class="info-row">
                    <span class="info-label">📍 Ciudad:</span>
                    <span class="info-value" id="displayCity">Buenos Aires, Argentina</span>
                </div>
                <div class="info-row">
                    <span class="info-label">💼 Trabajo:</span>
                    <span class="info-value" id="displayJob">Desarrollador Frontend</span>
                </div>
                <div class="info-row">
                    <span class="info-label">🎂 Edad:</span>
                    <span class="info-value" id="displayAge">28 años</span>
                </div>
                <div class="info-row">
                    <span class="info-label">📅 Miembro desde:</span>
                    <span class="info-value" id="displayJoined">Enero 2023</span>
                </div>
                <div class="info-row">
                    <span class="info-label">🟢 Estado:</span>
                    <span class="info-value">
                        Activo <span class="status-indicator"></span>
                    </span>
                </div>
            </div>
            
            <button class="edit-button" onclick="toggleEditMode()">✏️ Editar Perfil</button>
        </div>

        <!-- Modo Edición -->
        <div id="editMode" class="edit-mode">
            <div class="profile-picture">
                <span id="editInitials">JD</span>
            </div>
            
            <input type="text" class="input-field" id="editName" placeholder="Nombre completo" value="Juan Pérez">
            <input type="email" class="input-field" id="editEmail" placeholder="Email" value="juan.perez@email.com">
            <input type="tel" class="input-field" id="editPhone" placeholder="Teléfono" value="+54 11 1234-5678">
            <input type="text" class="input-field" id="editCity" placeholder="Ciudad" value="Buenos Aires, Argentina">
            <input type="text" class="input-field" id="editJob" placeholder="Trabajo" value="Desarrollador Frontend">
            <input type="number" class="input-field" id="editAge" placeholder="Edad" value="28">
            <input type="text" class="input-field" id="editJoined" placeholder="Miembro desde" value="Enero 2023">
            
            <button class="edit-button" onclick="saveProfile()" style="background: #4CAF50;">💾 Guardar</button>
            <button class="edit-button" onclick="cancelEdit()" style="background: #f44336;">❌ Cancelar</button>
        </div>
    </div>

    <script src="src/interfusuario.js"></script>
</body>
</html>
